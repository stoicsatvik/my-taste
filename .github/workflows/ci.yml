name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: Context smoke benchmark
        run: python benchmarks/context_smoke.py
      - name: V0.2 matched-budget TasteBench
        run: python benchmarks/tastebench_v02.py
      - name: Preserve rejected cumulative drift baseline
        continue-on-error: true
        run: python benchmarks/drift_gate_v02.py
      - name: Preserve rejected bounded-recency challenger
        continue-on-error: true
        run: python benchmarks/recency_gate_v02.py
      - name: V0.2 context-isolation recency challenger
        run: python benchmarks/context_isolation_gate_v02.py
      - name: Preserve rejected exact-context transfer gate
        continue-on-error: true
        run: python benchmarks/transfer_interference_gate_v02.py
      - name: Frozen hierarchical transfer-interference gate
        run: python benchmarks/hierarchical_context_gate_v02.py
