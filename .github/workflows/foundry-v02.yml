name: foundry-v02

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "BENCHMARK_PROTOCOL_V02.md"
      - "TEMPORAL_PROMOTION_PROTOCOL_V01.md"
      - ".github/workflows/foundry-v02.yml"

permissions:
  contents: read

concurrency:
  group: foundry-v02-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deterministic-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Baseline and challenger tests
        run: python -m pytest -q
      - name: Frozen 32-pair evidence
        run: |
          python - <<'PY'
          from my_taste.promotion import evaluate_v02_promotion
          from my_taste.tastebench import run_domain_leakage_check, run_sealed_context_benchmark
          benchmark = run_sealed_context_benchmark()
          leakage = run_domain_leakage_check()
          decision = evaluate_v02_promotion(benchmark, leakage, baseline_tests_passed=True, challenger_tests_passed=True)
          print({"benchmark": benchmark, "leakage": leakage, "decision": decision})
          if not decision["promote"]:
              raise SystemExit("V0.2 frozen promotion gate rejected challenger")
          PY
      - name: Preference drift evidence
        run: |
          python - <<'PY'
          from my_taste.driftbench import run_asymmetric_drift_matrix, run_preference_drift_benchmark
          print({"symmetric": run_preference_drift_benchmark(), "asymmetric": run_asymmetric_drift_matrix()})
          PY
      - name: Frozen temporal promotion evidence
        run: |
          python - <<'PY'
          from my_taste.temporalbench import run_adversarial_temporal_gate, run_temporal_policy_matrix
          matrix = run_temporal_policy_matrix()
          adversarial = run_adversarial_temporal_gate()
          passing = [score for score in adversarial if score.passes_gate]
          selected = min(passing, key=lambda score: (score.mean_post_drift_brier, -score.window)) if passing else None
          print({"policy_matrix": matrix, "adversarial": adversarial, "selected": selected})
          PY
