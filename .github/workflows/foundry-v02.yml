name: foundry-v02

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "BENCHMARK_PROTOCOL_V02.md"
      - ".github/workflows/foundry-v02.yml"

permissions:
  contents: read

concurrency:
  group: foundry-v02-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deterministic-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Baseline and challenger tests
        run: python -m pytest -q
      - name: Frozen 32-pair promotion evidence
        run: |
          python - <<'PY'
          from my_taste.promotion import evaluate_v02_promotion
          result = evaluate_v02_promotion()
          print(result)
          if not result["promote"]:
              raise SystemExit("V0.2 frozen promotion gate rejected challenger")
          PY
